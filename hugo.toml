baseURL = "https://tobias.schwabsters.com/"
theme = "LoveIt"
title = "Tobias"

defaultContentLanguage = "en"
languageCode = "en"
languageName = "English"
hasCJKLanguage = false

enableRobotsTXT = true
enableGitInfo = true
enableEmoji = true

# suppress noisy build errors from unused theme features
ignoreErrors = ["error-remote-getjson", "error-missing-instagram-accesstoken"]

[pagination]
  pagerSize = 10
  path = "page"

# top nav
[menu]
  [[menu.main]]
    weight = 1
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
  [[menu.main]]
    weight = 3
    identifier = "categories"
    name = "Collections"
    url = "/categories/"
  [[menu.main]]
    weight = 5
    identifier = "about"
    name = "About"
    url = "/about/"

[params]
  defaultTheme = "auto"
  gitRepo = "https://github.com/tobias-schwab/web-unus"
  dateFormat = "2006-01-02"
  # used for Open Graph / Twitter Card / RSS
  title = "Tobias"
  description = "An attempt to document the results of my incessant tinkering compulsion."
  images = ["/images/tobias_self4.jpg"]

  [params.author]
    name = "Tobias"

  [params.header]
    desktopMode = "fixed"
    mobileMode = "auto"
    [params.header.title]
      logo = "/images/usb-screw-logo.png"
      name = "Tobias' Occasional"
      typeit = false

  [params.footer]
    enable = false
    hugo = true
    copyright = true
    author = true
    since = 2026

  [params.section]
    paginate = 20
    dateFormat = "01-02"
    rss = 10

  [params.list]
    paginate = 20
    dateFormat = "01-02"
    rss = 10

  [params.app]
    title = "Tobias"
    noFavicon = false
    themeColor = "#ffffff"
    iconColor = "#5bbad5"
    tileColor = "#da532c"

  # client-side search, no external service needed
  [params.search]
    enable = true
    type = "fuse"
    contentLength = 4000
    maxResultLength = 10
    snippetLength = 30
    highlightTag = "em"
    [params.search.fuse]
      isCaseSensitive = false
      minMatchCharLength = 2
      threshold = 0.3
      distance = 100
      ignoreLocation = false

  [params.home]
    rss = 10
    [params.home.profile]
      enable = true
      avatarURL = "/images/tobias_self4.jpg"
      title = "Tobias"
      subtitle = ["A work in progress: this site, my projects, and me.", "Here you'll find an attempt to document the results of my incessant tinkering."]
      typeit = true
      social = true
    [params.home.posts]
      enable = true
      paginate = 6

  # shown on home page + used for share links
  [params.social]
    GitHub = "tobias-schwab"
    Linkedin = "tobias-p-schwab/"

  [params.page]
    ruby = true
    fraction = true
    fontawesome = true
    linkToMarkdown = true
    rssFullText = false

    [params.page.toc]
      enable = true
      keepStatic = false
      auto = true

    [params.page.code]
      copy = true
      maxShownLines = 50
      [params.page.code.render]
        goat = true
        mermaid = true

    [params.page.math]
      enable = false

    # per-post share buttons — just the two platforms that matter
    [params.page.share]
      enable = true
      X = false
      Linkedin = true

    # off for now, revisit later
    [params.page.comment]
      enable = false

  [params.typeit]
    speed = 80
    cursorSpeed = 1000
    cursorChar = "|"
    duration = -1

  [params.cdn]
    data = "jsdelivr.yml"

# Hugo's markdown parsing
[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = false
    lineNos = false
    lineNumbersInTable = true
    noClasses = true
  [markup.goldmark]
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
      linkify = true
      strikethrough = true
      table = true
      taskList = true
      typographer = true
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 6

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[permalinks]
  posts = ":contentbasename"

# lets each page also render as raw markdown, paired with linkToMarkdown above
[mediaTypes]
  [mediaTypes."text/plain"]
    suffixes = ["md"]

[outputFormats.MarkDown]
  mediaType = "text/plain"
  isPlainText = true
  isHTML = false

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML", "MarkDown"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]

# only keep the "category" taxonomy — this removes the tags
# taxonomy/system entirely (Hugo's tag default is dropped once
# taxonomies is defined explicitly)
[taxonomies]
  category = "categories"
